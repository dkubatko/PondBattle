# Every push to main builds the image and publishes it to GitHub's registry;
# Watchtower on Tower pulls the new :latest within a few minutes.
name: Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/dkubatko/pondbattle:latest
            ghcr.io/dkubatko/pondbattle:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
