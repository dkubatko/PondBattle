// Starting a game: pick the set of frogs it plays, on an endless wheel of cards: the card in the middle is the pick.
// "Any set" comes first and is the default (Play: the quickest match; elsewhere a random set). (i) on the picked set
// lists its frogs. Your last pick is kept (o.store: where). o.play: the Play picker.
// Endless: the cards are laid out several times over; after a swipe settles the wheel quietly jumps back to the same
// card in the middle copy, so there are always cards on both sides.
function pickSet(title, go, o = {}) {
  const store = o.store || 'frogSet';
  const ids = ['any', ...SET_IDS], COPIES = 5, MID = Math.floor(COPIES / 2);
  let set = ids.includes(localStorage[store]) ? localStorage[store] : 'any';
  // a card's three frogs: its cover (Any set: one from each set, then more)
  const cover = (id) => (id === 'any' ? [0, 1, 2].map((k) => { const x = SETS[SET_IDS[k % SET_IDS.length]]; return (x.cover || x.frogs)[Math.floor(k / SET_IDS.length)]; }) : (SETS[id].cover || SETS[id].frogs)).slice(0, 3);
  const card = (id, n) => `<div class="set-card" data-pick="${id}" data-n="${n}" role="button" tabindex="-1">
      ${id === 'any' ? '' : `<button class="set-info" data-info="${id}" aria-label="Frogs in ${esc(SETS[id].name)}">i</button>`}
      <div class="set-cover">${cover(id).map((t) => `<span class="sc" style="--s:${ART_SIZE[t] || 1}">${frogArt(t)}</span>`).join('')}</div>
      <div class="set-name">${id === 'any' ? `Any set<small>${o.play ? 'Quickest match' : 'A random set'}</small>` : `${esc(SETS[id].name)}<small>${SETS[id].frogs.length} frogs</small>`}</div>
    </div>`;
  const cards = Array.from({ length: COPIES }, (_, c) => ids.map((id, k) => card(id, c * ids.length + k)).join('')).join('');
  const s = sheet(`<h2>${esc(title)}</h2><p>Which frogs will be in the shop?</p><div class="set-cards">${cards}</div>
    <div class="btns"><button class="btn" data-a="go">${esc(o.cta || 'Start')}</button></div>`);
  const row = $('.set-cards', s.el), all = $$('.set-card', s.el);
  const offsetOf = (n) => all[n].offsetLeft - (row.clientWidth - all[n].offsetWidth) / 2;
  const nearest = () => { const mid = row.scrollLeft + row.clientWidth / 2; let best = 0, d = Infinity; all.forEach((c, n) => { const e = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (e < d) { d = e; best = n; } }); return best; };
  let current = -1, settle = 0, raf = 0;
  const pickCard = (n) => {
    if (n === current) return;
    current = n; set = all[n].dataset.pick;
    all.forEach((c, k) => c.classList.toggle('on', k === n));
  };
  // start with the remembered pick in the middle copy
  const start = MID * ids.length + ids.indexOf(set);
  requestAnimationFrame(() => { row.scrollLeft = offsetOf(start); pickCard(start); });
  row.addEventListener('scroll', () => {
    cancelAnimationFrame(raf); raf = requestAnimationFrame(() => pickCard(nearest()));
    clearTimeout(settle);
    settle = setTimeout(() => { // settled: move to the same card in the middle copy (no visible change)
      const n = nearest(), same = MID * ids.length + (n % ids.length);
      if (n !== same) { row.scrollLeft += offsetOf(same) - offsetOf(n); pickCard(same); }
    }, 160);
  });
  s.el.addEventListener('click', (e) => {
    const info = e.target.closest('[data-info]');
    if (info) { Snd.tap(); openSetInfo(info.dataset.info); return; }
    const c = e.target.closest('[data-pick]');
    if (c) { Snd.tap(); row.scrollTo({ left: offsetOf(+c.dataset.n), behavior: 'smooth' }); return; } // a side card comes to the middle
    if (e.target.closest('[data-a="go"]')) {
      Snd.tap(); localStorage[store] = set; s.close();
      // Play matches "any" itself; a practice game or a lobby gets a random set
      go(set === 'any' && !o.play ? SET_IDS[Math.floor(Math.random() * SET_IDS.length)] : set);
    }
  });
}
function openSetInfo(id) {
  sheet(`<h2>${esc(SETS[setId(id)].name)}</h2>${setFrogsHTML(id)}`);
}

// =====================================================================
// Battle
// =====================================================================
// Battle frames seen from your side: mine = your frogs, theirs = your partner's (seat 1 sees it flipped)
function viewFrames(lb, seat) {
  const flip = seat === 1;
  return lb.frames.map((f) => ({ ...f, mine: flip ? f.b : f.a, theirs: flip ? f.a : f.b, side: f.side === undefined ? undefined : (flip ? 1 - f.side : f.side) }));
}
// What happened, line by line, from the frames: hits and faints are read from how the frogs changed,
// abilities use their own caption. side: 'me' / 'them' (whose frog it was)
// fightAt: the first frame of the fighting itself; rows before it are start of battle (row.phase 'start' / 'battle')
function battleLog(frames, upto = frames.length - 1, fightAt = Infinity) {
  const rows = [], nm = (u) => NAMES[u.type] || 'Frog';
  const find = (f, id) => f.mine.find((u) => u.id === id) || f.theirs.find((u) => u.id === id);
  const sideOf = (f, id) => (f.mine.some((u) => u.id === id) ? 'me' : f.theirs.some((u) => u.id === id) ? 'them' : '');
  for (let k = 1; k <= upto && k < frames.length; k++) {
    const fr = frames[k], pv = frames[k - 1], from = rows.length;
    if (fr.kind === 'hit') {
      const [a, b] = fr.ids, leaps = new Map(fr.leaps || []), wide = new Map(fr.wide || []);
      for (const [x, other] of [[a, b], [b, a]]) {
        const u = find(pv, x); if (!u) continue;
        for (const id of leaps.get(x) || wide.get(x) || [other]) {
          const t0 = find(pv, id), t1 = find(fr, id); if (!t0) continue;
          const dmg = t0.hp - (t1 ? t1.hp : 0);
          const shell = (fr.shell || []).find(([sid]) => sid === id);
          if ((fr.gold || []).includes(id)) rows.push({ side: sideOf(pv, x), text: `${nm(u)}’s touch turns ${nm(t0)} to gold` });
          else if (dmg > 0) rows.push({ side: sideOf(pv, x), text: `${nm(u)} ${leaps.has(x) ? 'leaps over and hits' : wide.has(x) ? 'rolls into' : 'hits'} ${nm(t0)} for ${dmg}${shell ? `, but its shell stops ${shell[1]}` : ''}` });
          else if (t0.gear === 'bubble' && t1 && t1.gear === 'used') rows.push({ side: sideOf(pv, x), text: `${nm(u)} ${leaps.has(x) ? 'leaps over and hits' : wide.has(x) ? 'rolls into' : 'hits'} ${nm(t0)}, but its bubble blocks it` });
        }
      }
    } else if (fr.kind === 'spit') {
      // Dart Frog: reads like a hit, with the damage (or the bubble that took it)
      const u = find(pv, fr.actor), t0 = find(pv, fr.target), t1 = find(fr, fr.target);
      if (!u || !t0) continue;
      const dmg = t0.hp - (t1 ? t1.hp : 0);
      const shell = (fr.shell || []).find(([sid]) => sid === t0.id);
      if (dmg > 0) rows.push({ side: sideOf(pv, u.id), text: `${nm(u)} ${fr.arrow ? 'shoots' : 'spits at'} ${nm(t0)} for ${dmg}${shell ? `, but its shell stops ${shell[1]}` : ''}` });
      else if ((fr.immune || []).includes(t0.id)) rows.push({ side: sideOf(pv, u.id), text: `${nm(u)} ${fr.arrow ? 'shoots at' : 'spits at'} ${nm(t0)}, but it’s immune` });
      else if (t0.gear === 'bubble' && t1 && t1.gear === 'used') rows.push({ side: sideOf(pv, u.id), text: `${nm(u)} ${fr.arrow ? 'shoots at' : 'spits at'} ${nm(t0)}, but its bubble blocks it` });
    } else if (fr.kind === 'faint') {
      for (const u of [...pv.mine, ...pv.theirs]) if (!find(fr, u.id)) rows.push({ side: sideOf(pv, u.id), text: `${nm(u)} faints` });
    } else if (fr.text) {
      const id = fr.actor ?? fr.target;
      rows.push({ side: fr.kind === 'splash' ? (fr.side === 0 ? 'them' : 'me') : sideOf(pv, id) || sideOf(fr, id), text: fr.text });
    }
    // Hits that didn't touch a Rogue, or frogs guarded by a Frog King
    if (fr.kind !== 'spit') for (const id of fr.immune || []) { const u = find(pv, id); if (u) rows.push({ side: sideOf(pv, id), text: `${nm(u)} is immune` }); }
    // a Turtle Frog's shell during a splash or fire (hits and shots say it in their own line)
    if (fr.kind !== 'spit' && fr.kind !== 'hit') for (const [id, n] of fr.shell || []) { const u = find(pv, id); if (u) rows.push({ side: sideOf(pv, id), text: `${nm(u)}’s shell stops ${n}` }); }
    for (let j = from; j < rows.length; j++) rows[j].phase = k >= fightAt ? 'battle' : 'start';
  }
  return rows;
}
// The battle sheet: your partner's pond as it fought (front first) and the log so far (upto = frame index).
// Returns { update(upto) } so an open sheet can grow live during the battle: new lines slide in, and it
// keeps following the newest line unless you've scrolled up to read.
function openBattleSheet(lb, upto) {
  const frames = viewFrames(lb, S.seat), oppName = S.opp ? S.opp.name : 'Your partner';
  const lineup = frames[0].theirs.map((u, i) => `<div class="guide-row"><div class="gfrog">${frogHTML({ ...u, id: 900 + i }, { size: 46, idle: false })}</div><div class="txt"><span class="gname">${NAMES[u.type] || 'Frog'}${u.lvl > 1 ? ` <span class="lvl-in">Lv${u.lvl}</span>` : ''}</span>${descHTML(u.type, u.lvl)}</div></div>`).join('');
  const s = sheet(`<h2>Round ${lb.round}</h2>
    <div class="guide-sec">${esc(oppName)}’s pond <span class="sub">front first</span></div>${lineup}
    <div class="guide-sec">What happened</div>
    <div class="log-list"></div>`);
  const list = $('.log-list', s.el), box = $('.sheet-body', s.el);
  let shown = 0;
  // The log in four parts: what happened as the round ended (shown at once), start of battle, the battle, and what
  // happens after it (once it's over). Sections only grow at the end, so rows are only ever appended.
  const seatRows = (per) => (per || []).flatMap((list, seat) => list.map((x) => ({ side: seat === S.seat ? 'me' : 'them', text: x.text || x })));
  const fightAt = lb.fightAt ?? frames.findIndex((f) => f.kind === 'hit');
  const update = (to) => {
    if (!s.el.isConnected) return;
    const log = battleLog(frames, to, fightAt < 0 ? Infinity : fightAt), rows = [];

      for (const t of touched) if (!skipping) { anim($('.fbody', t.el), [{ filter: 'none' }, { filter: 'sepia(1) saturate(4) hue-rotate(5deg) brightness(1.25)', offset: .35 }, { filter: 'sepia(1) saturate(4) hue-rotate(5deg) brightness(1.25)' }], { duration: dur(520), fill: 'forwards' }); sparkles($('.fbody', t.el), 6, '#ffd76a'); }
      Snd.hit(); apply(fr, true);
      await wait(touched.length ? 620 : 520);
    } else if (fr.kind === 'faint') {
      Snd.faint(); apply(fr, true); await wait(560);
    } else if (fr.kind === 'spit') {
      caption(fr.text);
      const a = byId(fr.actor), t = byId(fr.target);
      if (a && t) {
        Snd.spit();
        anim(a.move, [{ transform: 'scale(1)' }, { transform: 'scale(1.15,.9)' }, { transform: 'scale(1)' }], { duration: dur(250) });
        // Dart Frog spits a ball; an Archer's arrow turns along its arc
        const ball = el(`<div class="${fr.arrow ? 'fx-arrow' : 'fx-ball'}"></div>`); arena.appendChild(ball);
        const y0 = a.y - U * .2, y1 = t.y - U * .2, mx = (a.x + t.x) / 2, my = Math.min(y0, y1) - 50 * s;
        const deg = (dx, dy) => (fr.arrow ? ` rotate(${(Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1)}deg)` : '');
        await anim(ball, [{ transform: `translate(${a.x - 7}px,${y0}px)${deg(mx - a.x, my - y0)}` }, { transform: `translate(${mx - 7}px,${my}px)${deg(t.x - a.x, 0)}` }, { transform: `translate(${t.x - 7}px,${y1}px)${deg(t.x - mx, y1 - my)}` }], { duration: dur(420), easing: 'ease-in-out' });
        ball.remove(); Snd.hit();
      }
      apply(fr, true); await wait(560);
    } else if (fr.kind === 'ability') {
      caption(fr.text);
      const r = byId(fr.actor) || byId(fr.target);
      ring(r); Snd.sparkle();
      if (r) anim(r.move, [{ transform: 'translateY(0)' }, { transform: `translateY(${-16 * s}px) scale(1.12)` }, { transform: 'translateY(0)' }], { duration: dur(380), easing: 'ease-out' });
      await wait(200); apply(fr, true); await wait(620);
    } else if (fr.kind === 'spell') {
      caption(fr.text); Snd.magic();
      const r = byId(fr.actor); ring(r, 'fx-ring magic');
      if (r) anim(r.move, [{ transform: 'translateY(0)' }, { transform: `translateY(${-18 * s}px) scale(1.12)` }, { transform: 'translateY(0)' }], { duration: dur(420), easing: 'ease-out' });
      await wait(260);
      // The spell flashes over each target, then it shrinks to 1/1 (same frog, same ability)
      (fr.targets || []).forEach((id) => { const t = byId(id); ring(t, 'fx-ring magic'); if (t) anim(t.move, [{ filter: 'brightness(1) hue-rotate(0deg)' }, { filter: 'brightness(1.8) hue-rotate(200deg)', offset: .5 }, { filter: 'brightness(1) hue-rotate(0deg)' }], { duration: dur(700) }); });
      await wait(420); Snd.summon(); apply(fr, true);
      (fr.targets || []).forEach((id) => { const t = byId(id); if (t && !skipping) anim(t.move, [{ transform: 'scale(1.2)' }, { transform: 'scale(.8)', offset: .5 }, { transform: 'scale(1)' }], { duration: dur(420), easing: 'ease-out' }); });
      await wait(700);
    } else if (fr.kind === 'charm') {
      // Princess: hearts drift over the charmed enemies, then they hit themselves
      caption(fr.text); Snd.magic();
      const r = byId(fr.actor); ring(r, 'fx-ring charm');
      if (r) anim(r.move, [{ transform: 'translateY(0)' }, { transform: `translateY(${-16 * s}px) scale(1.12)` }, { transform: 'translateY(0)' }], { duration: dur(420), easing: 'ease-out' });
      await wait(300);
      (fr.targets || []).forEach((id) => {
        const t = byId(id); if (!t) return;
        ring(t, 'fx-ring charm');
        if (!skipping) { const b = $('.fbody', t.el).getBoundingClientRect(); floatAt(b.left + b.width / 2, b.top, `<span class="charm">${ICON.heart(true)}</span>`); }
        anim(t.move, [{ transform: 'rotate(0)' }, { transform: 'rotate(-8deg)', offset: .25 }, { transform: 'rotate(8deg)', offset: .5 }, { transform: 'rotate(-5deg)', offset: .75 }, { transform: 'rotate(0)' }], { duration: dur(520) });
      });
      await wait(520); Snd.hit(); apply(fr, true); await wait(600);
    } else if (fr.kind === 'morph') {
      caption(fr.text); Snd.magic(); ring(byId(fr.actor), 'fx-ring magic');
      await wait(200); apply(fr, true); await wait(700);
    } else if (fr.kind === 'summon') {
      caption(fr.text); Snd.summon(); apply(fr, true); ring(byId(fr.actor));
      if (fr.by) ring(byId(fr.by), 'fx-ring magic'); // the Necromancer that raised it
      await wait(620);
    } else if (fr.kind === 'splash') {
      // Mossy Frog's splash, a Dragon's fire or Budgett's Frog's scream: one wave over the other pond. A Dragon or
      // Budgett's Frog first rears up (so it's clear who's acting) and sends its fire or its scream across.
      caption(fr.text);
      const [cx, cy] = pos(fr.side, 2), src = byId(fr.actor);
      if (src && !skipping) {
        anim(src.move, [{ transform: 'translateY(0) scale(1)' }, { transform: `translateY(${-12 * s}px) scale(1.08)`, offset: .5 }, { transform: 'translateY(0) scale(1)' }], { duration: dur(360), easing: 'ease-out' });
        await wait(200);
        const [x0, y0] = [src.x, src.y - U * .25];
        if (fr.fire) {
          Snd.spit();
          const ball = el('<div class="fx-fire"></div>'); arena.appendChild(ball);
          await anim(ball, [{ transform: `translate(${x0 - 10}px,${y0 - 10}px) scale(.5)` }, { transform: `translate(${(x0 + cx) / 2 - 10}px,${Math.min(y0, cy) - 30 * s}px) scale(.9)` }, { transform: `translate(${cx - 10}px,${cy - 10}px) scale(1.2)`, opacity: .7 }], { duration: dur(380), easing: 'ease-in' });
          ball.remove();
        } else {
          Snd.magic();
          for (let k = 0; k < 2; k++) {
            const r = el('<div class="fx-wave scream"></div>'), sz = 70 * s;
            Object.assign(r.style, { width: sz + 'px', height: sz * .6 + 'px', left: x0 - sz / 2 + 'px', top: y0 - sz * .3 + 'px' });
            arena.appendChild(r);
            anim(r, [{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: `translate(${cx - x0}px,${cy - y0}px) scale(1.4)`, opacity: 0 }], { duration: dur(620), delay: dur(k * 120), easing: 'ease-out' }).then(() => r.remove());
          }
          await wait(360);
        }
      }
      if (!fr.scream) Snd.splash();
      const w = el(`<div class="fx-wave${fr.fire ? ' fire' : fr.scream ? ' scream' : ''}"></div>`), size = 150 * s;
      Object.assign(w.style, { width: size + 'px', height: size * .5 + 'px', left: cx - size / 2 + 'px', top: cy - size * .15 + 'px' });
      arena.appendChild(w);
      anim(w, [{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(2.2)', opacity: 0 }], { duration: dur(700), easing: 'ease-out' }).then(() => w.remove());
      apply(fr, true); await wait(700);
    } else if (fr.kind === 'end') {
      apply(fr, true); await wait(300);
    } else {
      apply(fr, true); await wait(400);
    }
  }
  if (look) await look(frames.length);
  if (skipping) { apply(frames[frames.length - 1], false); caption(''); }
  await sleep(skipping ? 50 : 250);

  // Result
  Snd.duck(false);
  const w = lb.winner === -1 ? 'draw' : lb.winner === view.seat ? 'win' : 'lose';
  const final = view.phase === 'over';
  for (const [sel, p, isMe] of [['#bm', view.me, true], ['#bo', view.opp, false]]) {
    const box = $(sel), was = before(p, isMe).hearts;
    box.innerHTML = meta(p);
    if (p.hearts < was) {
      const h = box.querySelectorAll('.heart')[p.hearts];
      if (h) { anim(h, [{ transform: 'scale(1)' }, { transform: 'scale(1.6)', offset: .3 }, { transform: 'scale(1)' }], { duration: 450, easing: 'ease-out' }); const r = h.getBoundingClientRect(); floatAt(r.left + r.width / 2, r.top, '<span class="x">−1</span>'); }
    }
  }
  // The winner's plaque lights up and their frog puts on the crown; the result reads where the play-by-play was
  if (w !== 'draw') {
    const [plate, p, id] = w === 'win' ? ['#bsm', view.me, 1] : ['#bso', view.opp, 2];
    const pl = $(plate); pl.classList.add('won');
    $('.portrait', pl).innerHTML = avatarHTML(p.avatar, 42, { idle: true, id, centered: true, crown: true });
    anim($('.portrait', pl), [{ transform: 'scale(1)' }, { transform: 'scale(1.18)', offset: .4 }, { transform: 'scale(1)' }], { duration: 520, easing: 'ease-out' });
  }
  // The last play-by-play line fades and the result pops in at the top of the battlefield
  caption('');
  const res = el(`<div class="b-result ${w}"></div>`);
  res.textContent = { win: 'You win!', lose: `${view.opp.name} wins`, draw: 'It’s a tie' }[w];
  arena.appendChild(res);
  anim(res, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.12)', offset: .6 }, { opacity: 1, transform: 'scale(1)' }], { duration: 480, easing: 'cubic-bezier(.3, 1.4, .5, 1)' });
  const ctrl = $('.b-ctrl');
  ctrl.innerHTML = `<button class="btn ghost" id="replay">Replay</button><button class="btn" id="cont">${final ? 'Final score' : 'Next round'}</button>`;
  anim(ctrl, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  seen = frames.length - 1;
  logView?.update(seen);
  if (w === 'win') { Snd.win(); petals(18); } else if (w === 'lose') Snd.lose(); else Snd.draw();
  // The winning frogs keep celebrating until you leave: hop, hop, pause… all together
  const won = [...units.values()].filter((rec) => (w === 'win' && rec.side === 0) || (w === 'lose' && rec.side === 1));
  won.forEach((rec) => anim(rec.move, [
    { transform: 'none' }, { transform: `translateY(${-16 * s}px)`, offset: .12 }, { transform: 'none', offset: .24 },
    { transform: `translateY(${-12 * s}px)`, offset: .34 }, { transform: 'none', offset: .46 }, { transform: 'none' },
  ], { duration: 1700, iterations: Infinity, easing: 'ease-in-out' }));
  const again = await new Promise((r) => { $('#cont').onclick = () => r(false); $('#replay').onclick = () => r(true); });
  Snd.tap();
  if (again) return playBattle(lb);
  localStorage[seenKey()] = lb.id;
  if (final) overGame = view.game;
  playing = false;
  route();
}

// =====================================================================
// Game over
// =====================================================================
function showOver() {
  const restarted = S.game > overGame;
  const key = `over:${restarted}:${S.me.name}:${S.opp && S.opp.name}`;
  if (screen === 'over' && $('#root').dataset.k === key) return;
  const won = S.phase === 'over' ? S.winner === S.seat : null;
  const wasWin = screen === 'over' ? $('#root').dataset.won === '1' : won;
  const me = S.me, opp = S.opp;
  const node = el(`<div class="screen over fade-in">
    <div class="hero" style="width:100%"><div class="moon"></div><div class="leafbig" style='${padStyle(wasWin ? me.avatar : opp.avatar)}'></div>${avatarHTML(wasWin ? me.avatar : opp.avatar, 96, { idle: true, crown: true, id: 7 })}</div>
    <h1>${wasWin ? 'You win the pond' : `${esc(opp.name)} wins the pond`}</h1>
    ${restarted ? `<p class="lede">${esc(opp.name)} started a new game</p>` : ''}
    ${S.ranked && me.delta != null ? `<div class="over-rank">${rankBadge(me.rank, 40, Math.max(0, me.delta))}<span>${esc(me.rank.name)}</span>${signed(me.delta)}${RANK_ORDER.indexOf(me.rank.id) > RANK_ORDER.indexOf(me.prev) ? '<span class="up-note">New rank!</span>' : ''}</div>` : ''}
    ${restarted ? '' : `<div class="score"><div>${avatarHTML(me.avatar, 40, { id: 1 })}<b>${esc(me.name)}</b>${pips(5, me.hearts, ICON.heart)}</div><div class="${opp.pid ? 'tap' : ''}" id="overOpp">${avatarHTML(opp.avatar, 40, { id: 2 })}<b>${esc(opp.name)}</b>${pips(5, opp.hearts, ICON.heart)}</div></div>`}
    <div class="btns"><button class="btn" id="again">${restarted ? 'Join' : 'Play again'}</button><button class="btn ghost" id="leave">Home</button></div>
  </div>`);
  mount('over', node);
  $('#root').dataset.k = key; $('#root').dataset.won = wasWin ? '1' : '0';
  if (!restarted) { if (wasWin) { Snd.fanfare(); petals(34); } else Snd.lose(); }
  $('#again').onclick = async (e) => {
    if (e.currentTarget.disabled) return;
    e.currentTarget.disabled = true; // once: a second tap would ask for a second rematch
    Snd.plop();
    if (S.ranked) { forget(); return startSearch(localStorage.frogPlaySet || 'any'); } // ranked: a new match, not a rematch
    if (S.phase === 'over') await act({ type: 'rematch' });
    overGame = null; shownRound = 0; route();
  };
  $('#leave').onclick = () => { Snd.tap(); forget(); }; // the game is over: back to the home page
  const oc = $('#overOpp'); if (oc && opp.pid) oc.onclick = () => { Snd.tap(); openCard({ of: opp.pid }); };
}

// =====================================================================
// Boot
// =====================================================================
(async () => {
  try { await login(); } catch (e) { return mount('home', el(`<div class="screen home"><h1>Pond Brawl</h1><p class="lede">${esc(e.message)}</p></div>`)); }
  if (sess) connect(); else showHome();
})();
</script>
</body>
</html>
